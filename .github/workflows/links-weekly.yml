name: external links, weekly
on:
  schedule: [{ cron: "17 6 * * 1" }]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/build.py
      - uses: lycheeverse/lychee-action@v2
        id: lychee
        with:
          args: "--root-dir \"${{ github.workspace }}/site\" --cache --max-cache-age 1d --no-progress --header 'Accept: text/html' --accept 200,206 'site/**/*.html'"
          fail: false
      - name: open an issue when links broke
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Broken external links (weekly check)"
          content-filepath: ./lychee/out.md
          labels: links
